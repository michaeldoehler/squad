# cargo-deny configuration: `cargo deny check`
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Bundled SQLite < 3.54 in libsqlite3-sys, used only by the unpublished
    # benchmark tool squad-bench, which opens databases it created itself in
    # a temporary directory. The fixed libsqlite3-sys (0.39) cannot be used
    # yet: sqlx (a test dependency) pins libsqlite3-sys < 0.38, and Cargo
    # allows one version of a `links = "sqlite3"` crate per lockfile.
    { id = "RUSTSEC-2026-0459", reason = "benchmark-only, own files; blocked on sqlx" },
    # chrono, chrono-tz and humantime were declared unmaintained on
    # 2026-11-17 (no vulnerability). squad uses chrono and chrono-tz for
    # calendar arithmetic and time zone rules, sqlx (a test dependency)
    # uses chrono, and sqllogictest uses humantime. Moving squad to jiff is
    # planned; until then the advisories are acknowledged here.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; move to jiff planned" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained; move to jiff planned" },
    { id = "RUSTSEC-2026-0542", reason = "humantime, through sqllogictest (test runner only)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "OpenSSL",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
