[workspace]
resolver = "2"
members = ["crates/squad-storage", "crates/squad-kv", "crates/squad", "crates/squad-server", "crates/squad-bench", "crates/squad-columnar", "crates/squad-object", "crates/squad-sqllogictest", "crates/squad-difftest"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/michaeldoehler/squad"
authors = ["Michael Döhler"]

[workspace.dependencies]
squad-storage = { path = "crates/squad-storage", version = "0.1.0" }
squad-kv = { path = "crates/squad-kv", version = "0.1.0" }
squad = { path = "crates/squad", version = "0.1.0" }
parking_lot = "0.12"
thiserror = "2"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4

[profile.bench]
debug = 1
