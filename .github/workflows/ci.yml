name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # psql and pgbench let the server's tool tests run instead of skip.
      - name: Install PostgreSQL client tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client postgresql-contrib
      - name: Test
        run: cargo test --workspace --locked

  s3:
    name: Real S3 (Garage)
    runs-on: ubuntu-latest
    env:
      GARAGE_VERSION: v2.5.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Garage
        run: |
          curl -fsSL -o /usr/local/bin/garage \
            "https://garagehq.deuxfleurs.fr/_releases/${GARAGE_VERSION}/x86_64-unknown-linux-musl/garage"
          chmod +x /usr/local/bin/garage
          garage --version
      - name: Start Garage
        run: scripts/garage-dev.sh start | sed 's/^export //' | tr -d "'" >> "$GITHUB_ENV"
      - name: Test against Garage
        run: cargo test --release --locked --workspace
      - name: Garage log
        if: failure()
        run: cat "${TMPDIR:-/tmp}/squad-garage-dev/log"

  lint:
    name: Format, lints, docs, licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources bans

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
        env:
          RUSTFLAGS: ""

  simulation:
    name: Crash simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # More seeds than the default test run; see docs/testing.md.
      - name: Storage engine
        run: cargo test --release --locked -p squad-storage --test crash_sim
        env:
          SQUAD_SIM_SEEDS: 2000
          SQUAD_SIM_CONCURRENT_SEEDS: 300
      - name: SQL level
        run: cargo test --release --locked -p squad --test crash_sim
        env:
          SQUAD_SIM_SEEDS: 100

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: squad:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
