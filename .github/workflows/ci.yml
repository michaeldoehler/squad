name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # psql and pgbench let the server's tool tests run instead of skip.
      - name: Install PostgreSQL client tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client postgresql-contrib
      - name: Test
        run: cargo test --workspace --locked

  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  simulation:
    name: Crash simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # More seeds than the default test run; see docs/testing.md.
      - name: Storage engine
        run: cargo test --release --locked -p squad-storage --test crash_sim
        env:
          SQUAD_SIM_SEEDS: 2000
          SQUAD_SIM_CONCURRENT_SEEDS: 300
      - name: SQL level
        run: cargo test --release --locked -p squad --test crash_sim
        env:
          SQUAD_SIM_SEEDS: 100
